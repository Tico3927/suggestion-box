<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>意见箱 · 管理后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes slideIn { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:translateY(0) } }
    .animate-slideIn { animation: slideIn 0.3s ease-out forwards; }
    .status-pending { @apply bg-amber-100 text-amber-700; }
    .status-read { @apply bg-blue-100 text-blue-700; }
    .status-replied { @apply bg-green-100 text-green-700; }
    .status-archived { @apply bg-slate-100 text-slate-500; }
    tr:hover { background-color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen bg-slate-50">

  <!-- ============================================================
       登录页面
  ============================================================ -->
  <div id="loginPage" class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primary-100 text-primary-600 mb-4">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-slate-800">管理后台</h1>
        <p class="text-slate-500 text-sm mt-1">请输入管理密码</p>
      </div>
      <form id="loginForm" class="bg-white rounded-2xl shadow-lg p-6 space-y-4">
        <input
          type="password"
          id="passwordInput"
          placeholder="管理密码"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary-400 focus:ring-2 focus:ring-primary-100 outline-none transition-all text-slate-700"
          required
          autofocus
        >
        <p id="loginError" class="text-red-500 text-sm hidden text-center"></p>
        <button
          type="submit"
          id="loginBtn"
          class="w-full py-3 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl transition-colors disabled:opacity-50"
        >
          <span id="loginText">🔐 登录</span>
          <span id="loginSpinner" class="hidden">
            <svg class="inline w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            验证中……
          </span>
        </button>
      </form>
    </div>
  </div>

  <!-- ============================================================
       管理面板
  ============================================================ -->
  <div id="adminPage" class="hidden">

    <!-- 顶部导航 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-primary-100 text-primary-600 flex items-center justify-center">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.625 9.75a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375m-13.5 3.01c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.184-4.183a1.14 1.14 0 01.778-.332 48.294 48.294 0 005.83-.498c1.585-.233 2.708-1.626 2.708-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z" />
              </svg>
            </div>
            <h1 class="text-lg font-bold text-slate-800">意见箱管理</h1>
          </div>
          <div class="flex items-center gap-4">
            <button onclick="exportCSV()" class="text-sm text-slate-500 hover:text-primary-600 transition-colors font-medium flex items-center gap-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
              导出 CSV
            </button>
            <button onclick="refreshData()" class="text-sm text-slate-500 hover:text-primary-600 transition-colors font-medium flex items-center gap-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182" />
              </svg>
              刷新
            </button>
            <button onclick="logout()" class="text-sm text-slate-400 hover:text-red-500 transition-colors">退出</button>
          </div>
        </div>
      </div>
    </header>

    <!-- 主内容 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

      <!-- 统计卡片 -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="statsCards">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
          <p class="text-sm text-slate-500 mb-1">全部意见</p>
          <p class="text-2xl font-bold text-slate-800" id="statTotal">-</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
          <p class="text-sm text-slate-500 mb-1">待处理</p>
          <p class="text-2xl font-bold text-amber-500" id="statPending">-</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
          <p class="text-sm text-slate-500 mb-1">已读</p>
          <p class="text-2xl font-bold text-blue-500" id="statRead">-</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
          <p class="text-sm text-slate-500 mb-1">已回复</p>
          <p class="text-2xl font-bold text-green-500" id="statReplied">-</p>
        </div>
      </div>

      <!-- 筛选栏 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6">
        <div class="flex flex-wrap gap-3 items-center">
          <!-- 搜索 -->
          <div class="flex-1 min-w-[200px]">
            <input
              type="text"
              id="searchInput"
              placeholder="搜索意见内容……"
              class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:border-primary-400 focus:ring-2 focus:ring-primary-100 outline-none text-sm transition-all"
            >
          </div>
          <!-- 分类筛选 -->
          <select id="filterCategory" class="px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-primary-400 bg-white">
            <option value="">全部分类</option>
            <option value="教学">📚 教学</option>
            <option value="生活">🏠 生活</option>
            <option value="管理">🏛️ 管理</option>
            <option value="其他">💬 其他</option>
          </select>
          <!-- 状态筛选 -->
          <select id="filterStatus" class="px-3 py-2 rounded-lg border border-slate-200 text-sm outline-none focus:border-primary-400 bg-white">
            <option value="">全部状态</option>
            <option value="pending">🟡 待处理</option>
            <option value="read">🔵 已读</option>
            <option value="replied">🟢 已回复</option>
            <option value="archived">⚫ 已归档</option>
          </select>
          <button onclick="refreshData()" class="px-4 py-2 bg-primary-600 text-white text-sm font-medium rounded-lg hover:bg-primary-700 transition-colors">
            筛选
          </button>
        </div>
      </div>

      <!-- 列表 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="bg-slate-50 text-left">
                <th class="px-5 py-3 font-semibold text-slate-600">状态</th>
                <th class="px-5 py-3 font-semibold text-slate-600">分类</th>
                <th class="px-5 py-3 font-semibold text-slate-600">内容</th>
                <th class="px-5 py-3 font-semibold text-slate-600">提交者</th>
                <th class="px-5 py-3 font-semibold text-slate-600">时间</th>
                <th class="px-5 py-3 font-semibold text-slate-600">操作</th>
              </tr>
            </thead>
            <tbody id="suggestionTableBody">
              <tr><td colspan="6" class="px-5 py-12 text-center text-slate-400">加载中……</td></tr>
            </tbody>
          </table>
        </div>

        <!-- 分页 -->
        <div class="px-5 py-4 border-t border-slate-100 flex items-center justify-between" id="pagination">
          <span class="text-sm text-slate-500" id="pageInfo"></span>
          <div class="flex gap-2">
            <button id="prevBtn" onclick="goToPage(currentPage - 1)" class="px-3 py-1.5 text-sm border border-slate-200 rounded-lg hover:bg-slate-50 disabled:opacity-40 transition-colors">上一页</button>
            <button id="nextBtn" onclick="goToPage(currentPage + 1)" class="px-3 py-1.5 text-sm border border-slate-200 rounded-lg hover:bg-slate-50 disabled:opacity-40 transition-colors">下一页</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- ============================================================
       详情弹窗
  ============================================================ -->
  <div id="detailModal" class="fixed inset-0 z-50 flex items-center justify-center px-4 bg-black/40 backdrop-blur-sm hidden">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto animate-slideIn">
      <!-- 弹窗头部 -->
      <div class="sticky top-0 bg-white border-b border-slate-100 px-6 py-4 flex items-center justify-between rounded-t-2xl">
        <h3 class="text-lg font-bold text-slate-800">意见详情</h3>
        <button onclick="closeDetail()" class="text-slate-400 hover:text-slate-600 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <!-- 弹窗正文 -->
      <div class="px-6 py-5 space-y-5" id="detailContent"></div>
    </div>
  </div>

  <script>
    // ============================================================
    // 配置
    // ============================================================
    const SUPABASE_URL = 'https://jdjfjuufqrwrlzktxpry.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_wL94F028VcPA2A3wjKw_yw_N0ck5VCX';
    const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/admin-api`;

    // ============================================================
    // 全局状态
    // ============================================================
    let currentPage = 1;
    const PAGE_SIZE = 15;
    let totalCount = 0;
    let adminPassword = '';

    // ============================================================
    // 登录
    // ============================================================
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('passwordInput').value.trim();
      if (!pw) return;

      const loginBtn = document.getElementById('loginBtn');
      const loginText = document.getElementById('loginText');
      const loginSpinner = document.getElementById('loginSpinner');
      const loginError = document.getElementById('loginError');

      loginBtn.disabled = true;
      loginText.classList.add('hidden');
      loginSpinner.classList.remove('hidden');
      loginError.classList.add('hidden');

      try {
        const res = await callAdminAPI('verify', { password: pw });
        if (res.valid) {
          adminPassword = pw;
          sessionStorage.setItem('admin_pw', pw);
          showAdmin();
        } else {
          loginError.textContent = '密码错误';
          loginError.classList.remove('hidden');
        }
      } catch (err) {
        loginError.textContent = '连接失败：' + (err.message || '请检查网络');
        loginError.classList.remove('hidden');
      } finally {
        loginBtn.disabled = false;
        loginText.classList.remove('hidden');
        loginSpinner.classList.add('hidden');
      }
    });

    // ============================================================
    // 调用 Edge Function
    // ============================================================
    async function callAdminAPI(action, data = {}) {
      const res = await fetch(EDGE_FUNCTION_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({ action, password: adminPassword, ...data }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `HTTP ${res.status}`);
      }
      return res.json();
    }

    // ============================================================
    // 显示管理面板
    // ============================================================
    function showAdmin() {
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('adminPage').classList.remove('hidden');
      refreshData();
    }

    function logout() {
      adminPassword = '';
      sessionStorage.removeItem('admin_pw');
      document.getElementById('adminPage').classList.add('hidden');
      document.getElementById('loginPage').classList.remove('hidden');
      document.getElementById('passwordInput').value = '';
    }

    // ============================================================
    // 加载数据
    // ============================================================
    async function refreshData() {
      const search = document.getElementById('searchInput').value.trim();
      const category = document.getElementById('filterCategory').value;
      const status = document.getElementById('filterStatus').value;

      try {
        const res = await callAdminAPI('list', {
          page: currentPage,
          pageSize: PAGE_SIZE,
          search: search || undefined,
          category: category || undefined,
          status: status || undefined,
        });

        totalCount = res.total;
        renderTable(res.data);
        renderPagination();
        updateStats(res.stats);
      } catch (err) {
        document.getElementById('suggestionTableBody').innerHTML =
          `<tr><td colspan="6" class="px-5 py-12 text-center text-red-400">加载失败：${err.message}</td></tr>`;
      }
    }

    function updateStats(stats) {
      document.getElementById('statTotal').textContent = stats.total || 0;
      document.getElementById('statPending').textContent = stats.pending || 0;
      document.getElementById('statRead').textContent = stats.read || 0;
      document.getElementById('statReplied').textContent = stats.replied || 0;
    }

    // ============================================================
    // 渲染表格
    // ============================================================
    function renderTable(data) {
      const tbody = document.getElementById('suggestionTableBody');
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="px-5 py-12 text-center text-slate-400">暂无意见</td></tr>`;
        return;
      }

      const statusLabels = { pending: '待处理', read: '已读', replied: '已回复', archived: '已归档' };
      const statusColors = {
        pending: 'bg-amber-100 text-amber-700',
        read: 'bg-blue-100 text-blue-700',
        replied: 'bg-green-100 text-green-700',
        archived: 'bg-slate-100 text-slate-500',
      };

      tbody.innerHTML = data.map(s => `
        <tr class="border-b border-slate-50 cursor-pointer" onclick="openDetail('${s.id}')">
          <td class="px-5 py-3.5">
            <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-medium ${statusColors[s.status] || ''}">${statusLabels[s.status] || s.status}</span>
          </td>
          <td class="px-5 py-3.5 text-slate-600">${escapeHtml(s.category)}</td>
          <td class="px-5 py-3.5 max-w-xs">
            <p class="truncate text-slate-800">${escapeHtml(s.content)}</p>
          </td>
          <td class="px-5 py-3.5 text-slate-500">
            ${s.is_anonymous ? '<span class="text-slate-400 italic">匿名</span>' : escapeHtml(s.author_name || '匿名')}
          </td>
          <td class="px-5 py-3.5 text-slate-400 text-xs whitespace-nowrap">${formatTime(s.created_at)}</td>
          <td class="px-5 py-3.5" onclick="event.stopPropagation()">
            <button onclick="openDetail('${s.id}')" class="text-primary-600 hover:text-primary-800 text-xs font-medium">查看</button>
          </td>
        </tr>
      `).join('');
    }

    function renderPagination() {
      const totalPages = Math.ceil(totalCount / PAGE_SIZE) || 1;
      document.getElementById('pageInfo').textContent = `共 ${totalCount} 条，第 ${currentPage} / ${totalPages} 页`;
      document.getElementById('prevBtn').disabled = currentPage <= 1;
      document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    }

    function goToPage(page) {
      const totalPages = Math.ceil(totalCount / PAGE_SIZE) || 1;
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      refreshData();
    }

    // ============================================================
    // 详情弹窗
    // ============================================================
    async function openDetail(id) {
      try {
        const res = await callAdminAPI('get', { id });
        const s = res.data;
        if (!s) return;

        const statusLabels = { pending: '待处理', read: '已读', replied: '已回复', archived: '已归档' };
        const statusOptions = [
          { value: 'pending', label: '🟡 待处理' },
          { value: 'read', label: '🔵 已读' },
          { value: 'replied', label: '🟢 已回复' },
          { value: 'archived', label: '⚫ 归档' },
        ];

        const detailContent = document.getElementById('detailContent');
        detailContent.innerHTML = `
          <!-- 元信息 -->
          <div class="flex flex-wrap gap-3 text-sm">
            <span class="px-2.5 py-0.5 rounded-full text-xs font-medium ${statusLabels[s.status] ? 'bg-primary-100 text-primary-700' : ''}">
              ${statusLabels[s.status] || s.status}
            </span>
            <span class="text-slate-500">📂 ${escapeHtml(s.category)}</span>
            <span class="text-slate-500">${s.is_anonymous ? '🕶️ 匿名' : '👤 ' + escapeHtml(s.author_name || '未留名')}</span>
            ${s.author_email && !s.is_anonymous ? `<span class="text-slate-500">📧 ${escapeHtml(s.author_email)}</span>` : ''}
            <span class="text-slate-400">🕐 ${formatTime(s.created_at)}</span>
          </div>

          <!-- 意见内容 -->
          <div class="bg-slate-50 rounded-xl p-4">
            <p class="text-slate-800 whitespace-pre-wrap leading-relaxed">${escapeHtml(s.content)}</p>
          </div>

          <!-- 回复列表 -->
          <div>
            <h4 class="text-sm font-semibold text-slate-700 mb-3">回复记录 (${(s.replies || []).length})</h4>
            ${(s.replies || []).length === 0
              ? '<p class="text-slate-400 text-sm">暂无回复</p>'
              : (s.replies || []).map(r => `
                <div class="bg-blue-50 rounded-xl p-3 mb-2">
                  <p class="text-slate-700 text-sm whitespace-pre-wrap">${escapeHtml(r.content)}</p>
                  <p class="text-slate-400 text-xs mt-1">${formatTime(r.created_at)}</p>
                </div>
              `).join('')
            }
          </div>

          <!-- 状态切换 -->
          <div>
            <h4 class="text-sm font-semibold text-slate-700 mb-2">更改状态</h4>
            <div class="flex flex-wrap gap-2">
              ${statusOptions.map(o => `
                <button
                  onclick="changeStatus('${s.id}', '${o.value}')"
                  class="px-3 py-1.5 text-sm rounded-lg border transition-colors ${s.status === o.value ? 'border-primary-500 bg-primary-50 text-primary-700 font-medium' : 'border-slate-200 text-slate-600 hover:border-primary-300'}"
                >${o.label}</button>
              `).join('')}
            </div>
          </div>

          <!-- 回复表单 -->
          <div>
            <h4 class="text-sm font-semibold text-slate-700 mb-2">添加回复</h4>
            <textarea
              id="replyContent"
              rows="3"
              maxlength="2000"
              placeholder="输入回复内容……"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-primary-400 focus:ring-2 focus:ring-primary-100 outline-none text-sm transition-all resize-none"
            ></textarea>
            <button
              onclick="submitReply('${s.id}')"
              class="mt-2 px-5 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-xl transition-colors"
            >发送回复</button>
            <span id="replyError" class="text-red-400 text-xs ml-3 hidden"></span>
          </div>
        `;

        document.getElementById('detailModal').classList.remove('hidden');
      } catch (err) {
        alert('加载详情失败：' + err.message);
      }
    }

    function closeDetail() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    document.getElementById('detailModal').addEventListener('click', function(e) {
      if (e.target === this) closeDetail();
    });

    // ============================================================
    // 状态变更
    // ============================================================
    async function changeStatus(id, newStatus) {
      try {
        await callAdminAPI('updateStatus', { id, status: newStatus });
        refreshData();
        // 刷新详情
        openDetail(id);
      } catch (err) {
        alert('操作失败：' + err.message);
      }
    }

    // ============================================================
    // 提交回复
    // ============================================================
    async function submitReply(id) {
      const content = document.getElementById('replyContent').value.trim();
      const errorEl = document.getElementById('replyError');
      if (!content) {
        errorEl.textContent = '请输入回复内容';
        errorEl.classList.remove('hidden');
        return;
      }
      errorEl.classList.add('hidden');

      try {
        await callAdminAPI('reply', { id, content });
        document.getElementById('replyContent').value = '';
        refreshData();
        openDetail(id);
      } catch (err) {
        errorEl.textContent = '回复失败：' + err.message;
        errorEl.classList.remove('hidden');
      }
    }

    // ============================================================
    // 导出 CSV
    // ============================================================
    async function exportCSV() {
      try {
        const res = await callAdminAPI('export');
        const csv = res.csv;
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `suggestions_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        alert('导出失败：' + err.message);
      }
    }

    // ============================================================
    // 工具函数
    // ============================================================
    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatTime(ts) {
      if (!ts) return '-';
      const d = new Date(ts);
      const now = new Date();
      const diff = now - d;
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return `${Math.floor(diff / 60000)} 分钟前`;
      if (diff < 86400000) return `${Math.floor(diff / 3600000)} 小时前`;
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const h = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      if (y === now.getFullYear()) return `${m}-${day} ${h}:${min}`;
      return `${y}-${m}-${day}`;
    }

    // ============================================================
    // 页面初始化：检查是否已登录
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      const savedPw = sessionStorage.getItem('admin_pw');
      if (savedPw) {
        adminPassword = savedPw;
        // 验证密码是否仍然有效
        callAdminAPI('verify', { password: savedPw })
          .then(res => { if (res.valid) showAdmin(); else sessionStorage.removeItem('admin_pw'); })
          .catch(() => sessionStorage.removeItem('admin_pw'));
      }
    });
  </script>
</body>
